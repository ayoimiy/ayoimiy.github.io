# ==============================================
# 第一步：指定主题与皮肤 (Theme & Skin)
# ==============================================
# 指定使用 Minimal Mistakes 主题 (GitHub Pages 专用方式)
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
# 选择皮肤 (默认: "default")
# 可选: "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"
minimal_mistakes_skin: "air"

# ==============================================
# 第二步：网站基本信息 (Site Settings)
# ==============================================
title: "算法"          # 网站主标题，出现在浏览器标签和导航栏
title_separator: "-"          # 页面标题和网站标题之间的分隔符
subtitle: "寻路算法 · Lua 编程 · 数学笔记"      # 副标题，显示在网站主标题下方 (可选)
locale: "zh-CN"               # 网站语言
og_image: "/assets/images/avatar.jpg"  # Open Graph 默认分享图
name: "ayoimiy"               # 网站作者或拥有者名称
description: "ayoimiy 的技术博客，分享寻路算法、Lua 编程、Noita Mod 开发、数据结构与算法笔记"     # 用于 SEO 的网站描述
url: "https://ayoimiy.github.io" # 你的博客域名 (重要，需替换)
baseurl: ""                   # 你的博客在根目录下，这里留空
repository: "ayoimiy/ayoimiy.github.io" # 你的 GitHub 仓库 (重要，需替换)
search: true                     # 启用 lunr 全文搜索
lunr:
  search_within_pages: false

# ==============================================
# 第三步：插件与构建 (Plugins & Build)
# ==============================================
plugins:
  - jekyll-include-cache       # Remote Theme 必需的插件
  - jekyll-paginate            # 文章分页
  - jekyll-sitemap             # 生成站点地图
  - jekyll-gist                # 嵌入 GitHub Gist
  - jekyll-feed                # 生成 RSS feed
  - jemoji                     # 支持 GitHub 风格的 Emoji
  - jekyll-remote-theme
  - jekyll-archives
  # - jekyll-toc
  - jekyll-numbered-headings


paginate: 5                    # 每页显示的文章数
paginate_path: /page:num/      # 分页页面的路径



# ==============================================
# 第四步：评论与数据分析 (Comments & Analytics) (可选)
# ==============================================
# giscus 评论（基于 GitHub Discussions，免费无广告）
# 配置步骤:
#   1. 仓库启用 Discussions: https://github.com/ayoimiy/ayoimiy.github.io/settings
#   2. 安装 giscus app: https://github.com/apps/giscus
#   3. 访问 https://giscus.app/ 获取 repo_id 和 category_id
comments:
  provider: "giscus"
  giscus:
    repo_id: "REPO_ID"           # 从 giscus.app 获取
    category_name: "General"     # Discussions 分类名
    category_id: "CATEGORY_ID"   # 从 giscus.app 获取
    discussion_term: "pathname"
    reactions_enabled: "1"
    theme: "preferred_color_scheme"
    strict: false

# Google Analytics 追踪 ID
# analytics:
#   provider: "google-gtag"
#   google:
#     tracking_id: "你的G-XXXXXXXXXX"

# ==============================================
# 第五步：默认页面设置 (Default Front Matter)
# ==============================================
defaults:
  # _posts 目录下的文章默认设置
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: false
      related: true
      toc: true
      # toc_sticky: true
  # _pages 目录下的页面默认设置
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ==============================================
# 第六步：作者与社交信息 (Author & Social Links) (可选)
# ==============================================
author:
  name: "ayoimiy"
  avatar: "/assets/images/avatar.jpg" # 头像图片路径
  bio: "这是一个简介"
  location: "2号平行世界"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ayoimiy"
    # 更多链接可以参考官方文档添加
    # - label: "Twitter"
    #   icon: "fab fa-fw fa-twitter-square"
    #   url: "https://twitter.com/"

# 社交分享链接 (分享到哪些平台)
social:
  type: "Person"
  name: "你的名字"
  links:
    - "https://github.com/ayoimiy"

# 页脚版权信息
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/ayoimiy"

jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: archive-taxonomy
    tag: archive-taxonomy
  permalinks:
    category: /categories/:name/   #归档页面的访问地址
    tag: /tags/:name/
